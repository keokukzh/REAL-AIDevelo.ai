name: Docker Registry Cleanup

on:
  schedule:
    # Run weekly on Sunday at 3 AM UTC
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      keep_count:
        description: 'Number of recent versions to keep'
        required: false
        default: '10'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  cleanup-untagged:
    name: Remove Untagged Images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    
    steps:
      - name: Delete untagged images
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.IMAGE_NAME }}
          package-type: 'container'
          min-versions-to-keep: 0
          delete-only-untagged-versions: 'true'

  cleanup-old-versions:
    name: Remove Old Tagged Versions
    runs-on: ubuntu-latest
    permissions:
      packages: write
    
    steps:
      - name: Keep only recent versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.IMAGE_NAME }}
          package-type: 'container'
          min-versions-to-keep: ${{ github.event.inputs.keep_count || 10 }}
          ignore-versions: '^(latest|main|develop|v\d+\.\d+\.\d+)$'

  cleanup-pr-images:
    name: Remove PR Images (Closed PRs)
    runs-on: ubuntu-latest
    permissions:
      packages: write
      pull-requests: read
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get closed PRs
        id: closed-prs
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              per_page: 100
            });
            
            const prNumbers = prs.map(pr => `pr-${pr.number}`);
            core.setOutput('pr-patterns', prNumbers.join('|'));
            return prNumbers;

      - name: Delete closed PR images
        if: steps.closed-prs.outputs.pr-patterns != ''
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.IMAGE_NAME }}
          package-type: 'container'
          min-versions-to-keep: 0
          ignore-versions: '^(latest|main|develop|v\d+\.\d+\.\d+)$'

  report:
    name: Generate Cleanup Report
    runs-on: ubuntu-latest
    needs: [cleanup-untagged, cleanup-old-versions, cleanup-pr-images]
    if: always()
    
    steps:
      - name: Create summary
        run: |
          echo "## 🧹 Docker Registry Cleanup Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Cleanup completed at $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Actions Taken:" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Removed untagged images" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Removed old versions (keeping 10 most recent)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Removed closed PR images" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Protected Tags:" >> $GITHUB_STEP_SUMMARY
          echo "- \`latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`main\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`develop\`" >> $GITHUB_STEP_SUMMARY
          echo "- Semantic versions (v*.*.*)" >> $GITHUB_STEP_SUMMARY
