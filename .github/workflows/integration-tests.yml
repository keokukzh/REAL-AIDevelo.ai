name: Integration Tests with Docker

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  schedule:
    # Run integration tests daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Create test environment file
        run: |
          cat << EOF > .env.test
          NODE_ENV=test
          PORT=5001
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/aidevelo_test
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=postgres
          POSTGRES_DB=aidevelo_test
          REDIS_URL=redis://localhost:6379
          MINIO_ENDPOINT=localhost:9000
          MINIO_ACCESS_KEY=minioadmin
          MINIO_SECRET_KEY=minioadmin
          MINIO_BUCKET=test-recordings
          QDRANT_URL=http://localhost:6333
          FREESWITCH_ESL_HOST=localhost
          FREESWITCH_ESL_PORT=8021
          FREESWITCH_ESL_PASSWORD=ClueCon
          EOF

      - name: Start infrastructure services
        run: |
          docker compose -f docker-compose.test.yml up -d postgres redis minio qdrant
          
          # Wait for services to be ready
          echo "Waiting for services to be healthy..."
          timeout 60 bash -c 'until docker compose -f docker-compose.test.yml ps postgres | grep -q "healthy"; do sleep 2; done'
          timeout 60 bash -c 'until docker compose -f docker-compose.test.yml ps redis | grep -q "healthy"; do sleep 2; done'
          timeout 60 bash -c 'until docker compose -f docker-compose.test.yml ps minio | grep -q "healthy"; do sleep 2; done'
          timeout 60 bash -c 'until docker compose -f docker-compose.test.yml ps qdrant | grep -q "healthy"; do sleep 2; done'

      - name: Setup MinIO buckets
        run: |
          # Install MinIO client
          wget https://dl.min.io/client/mc/release/linux-amd64/mc
          chmod +x mc
          ./mc alias set testminio http://localhost:9000 minioadmin minioadmin
          ./mc mb testminio/test-recordings --ignore-existing

      - name: Install dependencies
        run: |
          npm ci
          cd server && npm ci

      - name: Run database migrations
        run: |
          cd server
          npm run migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aidevelo_test

      - name: Run backend integration tests
        run: |
          cd server
          npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aidevelo_test
          REDIS_URL: redis://localhost:6379

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Build application
        run: npm run build

      - name: Start application in Docker
        run: |
          docker compose -f docker-compose.test.yml up -d aidevelo
          
          # Wait for application to be ready
          echo "Waiting for application to start..."
          timeout 120 bash -c 'until curl -f http://localhost:5001/health || curl -f http://localhost:5001/api/health; do sleep 2; done'

      - name: Run E2E tests
        run: |
          npx playwright install --with-deps
          npm run test:e2e
        env:
          BASE_URL: http://localhost:5001

      - name: Run API smoke tests
        run: |
          # Test health endpoints
          curl -f http://localhost:5001/health || curl -f http://localhost:5001/api/health
          
          # Test that services are responding
          curl -f http://localhost:6333/health  # Qdrant
          curl -f http://localhost:9000/minio/health/live  # MinIO

      - name: Collect container logs
        if: failure()
        run: |
          mkdir -p logs
          docker compose -f docker-compose.test.yml logs > logs/docker-compose.log
          docker compose -f docker-compose.test.yml logs aidevelo > logs/app.log
          docker compose -f docker-compose.test.yml logs postgres > logs/postgres.log
          docker compose -f docker-compose.test.yml logs redis > logs/redis.log

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-logs
          path: logs/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            playwright-report/
            coverage/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  docker-compose-validation:
    name: Validate Docker Compose Files
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        compose-file:
          - docker-compose.yml
          - docker-compose.dev.yml
          - docker-compose.test.yml
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate compose file
        run: |
          docker compose -f ${{ matrix.compose-file }} config > /dev/null
          echo "✅ ${{ matrix.compose-file }} is valid"

      - name: Check for common issues
        run: |
          # Check for hardcoded localhost
          if grep -q "localhost" ${{ matrix.compose-file }}; then
            echo "⚠️ Warning: Found 'localhost' in compose file. Consider using service names."
          fi
          
          # Check for missing health checks on critical services
          if ! grep -q "healthcheck:" ${{ matrix.compose-file }}; then
            echo "⚠️ Warning: No health checks defined in compose file."
          fi

  performance-test:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Start services
        run: |
          docker compose -f docker-compose.test.yml up -d postgres redis minio qdrant aidevelo
          
          # Wait for application
          timeout 120 bash -c 'until curl -f http://localhost:5001/health || curl -f http://localhost:5001/api/health; do sleep 2; done'

      - name: Install dependencies
        run: npm ci

      - name: Run performance tests
        run: npm run test:performance
        env:
          BASE_URL: http://localhost:5001

      - name: Generate performance report
        if: always()
        run: |
          echo "## Performance Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Performance tests completed. Check artifacts for detailed results." >> $GITHUB_STEP_SUMMARY

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
