name: Docker Build Cache Management

on:
  schedule:
    # Clean up cache weekly to prevent bloat
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  cache-cleanup:
    name: Clean Build Cache
    runs-on: ubuntu-latest
    permissions:
      actions: write
    
    steps:
      - name: Cleanup old caches
        uses: actions/github-script@v7
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            const oneWeekAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);
            
            for (const cache of caches.data.actions_caches) {
              const cacheDate = new Date(cache.created_at).getTime();
              if (cacheDate < oneWeekAgo) {
                console.log(`Deleting cache: ${cache.key}`);
                await github.rest.actions.deleteActionsCacheById({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  cache_id: cache.id,
                });
              }
            }

  cache-stats:
    name: Report Cache Statistics
    runs-on: ubuntu-latest
    
    steps:
      - name: Get cache statistics
        uses: actions/github-script@v7
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            const totalSize = caches.data.actions_caches.reduce((sum, cache) => 
              sum + cache.size_in_bytes, 0
            );
            const sizeMB = (totalSize / 1024 / 1024).toFixed(2);
            
            console.log(`Total caches: ${caches.data.total_count}`);
            console.log(`Total size: ${sizeMB} MB`);
            
            core.summary
              .addHeading('Docker Build Cache Statistics')
              .addTable([
                [{data: 'Metric', header: true}, {data: 'Value', header: true}],
                ['Total Caches', caches.data.total_count.toString()],
                ['Total Size', `${sizeMB} MB`],
                ['Limit', '10 GB'],
              ])
              .write();
