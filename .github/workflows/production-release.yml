name: Production Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string
      deploy_frontend:
        description: 'Deploy frontend to Cloudflare Pages'
        required: false
        type: boolean
        default: true
      deploy_backend:
        description: 'Deploy backend to Render'
        required: false
        type: boolean
        default: true
      skip_tests:
        description: 'Skip test suite (emergency only)'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: 20

jobs:
  validate-version:
    name: Validate Release Version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate version format
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9]+)?$ ]]; then
            echo "❌ Invalid version format: $VERSION"
            echo "Expected format: v1.0.0 or v1.0.0-beta"
            exit 1
          fi
          echo "✅ Version format valid: $VERSION"

      - name: Check if tag already exists
        run: |
          if git rev-parse "${{ github.event.inputs.version }}" >/dev/null 2>&1; then
            echo "❌ Tag ${{ github.event.inputs.version }} already exists"
            exit 1
          fi
          echo "✅ Tag is available"

  pre-release-tests:
    name: Pre-Release Tests
    runs-on: ubuntu-latest
    needs: validate-version
    if: github.event.inputs.skip_tests == 'false'
    strategy:
      fail-fast: true
      matrix:
        suite:
          - name: "Frontend Tests"
            command: "npm run test:unit -- --run"
            workdir: "."
          - name: "Backend Tests"  
            command: "npm run test:unit"
            workdir: "server"
          - name: "Linting"
            command: "npm run lint && npm run lint:api-prefix"
            workdir: "."

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.suite.workdir == 'server' && 'server/package-lock.json' || 'package-lock.json' }}

      - name: Install dependencies
        working-directory: ${{ matrix.suite.workdir }}
        run: npm ci

      - name: Run ${{ matrix.suite.name }}
        working-directory: ${{ matrix.suite.workdir }}
        run: ${{ matrix.suite.command }}

  build-and-verify:
    name: Build and Verify
    runs-on: ubuntu-latest
    needs: [validate-version, pre-release-tests]
    if: always() && (needs.pre-release-tests.result == 'success' || github.event.inputs.skip_tests == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify frontend build
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Frontend build failed - dist directory not found"
            exit 1
          fi
          if [ ! -f "dist/index.html" ]; then
            echo "❌ Frontend build failed - index.html not found"
            exit 1
          fi
          echo "✅ Frontend build successful"

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.event.inputs.version }}
          path: dist
          retention-days: 30

      - name: Install backend dependencies
        working-directory: server
        run: npm ci

      - name: Build backend
        working-directory: server
        run: npm run build

      - name: Verify backend build
        working-directory: server
        run: |
          if [ ! -d "dist" ]; then
            echo "❌ Backend build failed - dist directory not found"
            exit 1
          fi
          echo "✅ Backend build successful"

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build-${{ github.event.inputs.version }}
          path: server/dist
          retention-days: 30

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate-version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run security audit - Frontend
        run: |
          npm audit --production --audit-level=high || echo "⚠️ Frontend vulnerabilities detected"

      - name: Run security audit - Backend
        working-directory: server
        run: |
          npm audit --production --audit-level=high || echo "⚠️ Backend vulnerabilities detected"

      - name: Check for secrets
        run: |
          if git diff HEAD~1 | grep -iE "(api[_-]?key|secret|password|token|private[_-]?key)"; then
            echo "⚠️ Potential secrets detected in recent commits"
            echo "Please review before proceeding with release"
          else
            echo "✅ No secrets detected"
          fi

  create-release-tag:
    name: Create Release Tag
    runs-on: ubuntu-latest
    needs: [build-and-verify, security-scan]
    outputs:
      tag_created: ${{ steps.create-tag.outputs.tag_created }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create and push tag
        id: create-tag
        run: |
          VERSION="${{ github.event.inputs.version }}"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          echo "tag_created=true" >> $GITHUB_OUTPUT
          echo "✅ Tag $VERSION created and pushed"

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ github.event.inputs.version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          
          echo "## Changes in $VERSION" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          
          if [ -n "$PREV_TAG" ]; then
            echo "### Commits since $PREV_TAG:" >> RELEASE_NOTES.md
            git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" >> RELEASE_NOTES.md
          else
            echo "### Initial Release" >> RELEASE_NOTES.md
            git log --pretty=format:"- %s (%h)" --max-count=20 >> RELEASE_NOTES.md
          fi
          
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.version }}
          release_name: Release ${{ github.event.inputs.version }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.event.inputs.version, '-') }}

  deploy-frontend:
    name: Deploy Frontend to Production
    runs-on: ubuntu-latest
    needs: create-release-tag
    if: github.event.inputs.deploy_frontend == 'true'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ github.event.inputs.version }}
          path: dist

      - name: Deploy to Cloudflare Pages
        if: secrets.CLOUDFLARE_API_TOKEN != ''
        run: |
          npm install -g wrangler
          wrangler pages deploy dist \
            --project-name=${CF_PAGES_PROJECT_NAME:-aidevelo-ai} \
            --commit-hash=${{ github.sha }} \
            --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify frontend deployment
        run: |
          sleep 10
          FRONTEND_URL="${{ vars.FRONTEND_URL || 'https://aidevelo.ai' }}"
          echo "Testing frontend at $FRONTEND_URL"
          
          for i in {1..5}; do
            if curl -f -s "$FRONTEND_URL" > /dev/null; then
              echo "✅ Frontend is accessible"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done
          
          echo "⚠️ Frontend verification failed"
          exit 1

  deploy-backend:
    name: Deploy Backend to Production
    runs-on: ubuntu-latest
    needs: create-release-tag
    if: github.event.inputs.deploy_backend == 'true'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Render deployment
        if: secrets.RENDER_DEPLOY_HOOK_URL != ''
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "✅ Render deployment triggered"

      - name: Wait for deployment
        run: |
          echo "Waiting 60 seconds for backend to deploy..."
          sleep 60

      - name: Run database migrations
        if: vars.RUN_MIGRATIONS == 'true'
        run: |
          echo "⚠️ Database migrations should be run manually for safety"
          echo "Run: cd server && npm run migrate"

      - name: Verify backend deployment
        run: |
          API_URL="${{ vars.API_URL || 'https://real-aidevelo-ai.onrender.com' }}"
          HEALTH_ENDPOINT="$API_URL/api/health"
          echo "Testing API health at $HEALTH_ENDPOINT"
          
          for i in {1..10}; do
            if curl -f -s "$HEALTH_ENDPOINT" | grep -q '"status":"ok"'; then
              echo "✅ Backend health check passed"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 15s..."
            sleep 15
          done
          
          echo "⚠️ Backend health check failed"
          exit 1

  post-deployment-tests:
    name: Post-Deployment Verification
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    if: always() && (needs.deploy-frontend.result == 'success' || needs.deploy-backend.result == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run production smoke tests
        run: npm run audit:prod
        env:
          BASE_URL: ${{ vars.FRONTEND_URL || 'https://aidevelo.ai' }}
        continue-on-error: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-test-results-${{ github.event.inputs.version }}
          path: playwright-report/
          retention-days: 30

  notify-deployment:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend, post-deployment-tests]
    if: always()
    steps:
      - name: Prepare notification
        run: |
          VERSION="${{ github.event.inputs.version }}"
          FRONTEND_STATUS="${{ needs.deploy-frontend.result }}"
          BACKEND_STATUS="${{ needs.deploy-backend.result }}"
          TESTS_STATUS="${{ needs.post-deployment-tests.result }}"
          
          echo "## 🚀 Production Release: $VERSION" > notification.md
          echo "" >> notification.md
          echo "### Deployment Status:" >> notification.md
          echo "- Frontend: $FRONTEND_STATUS" >> notification.md
          echo "- Backend: $BACKEND_STATUS" >> notification.md
          echo "- Post-Deploy Tests: $TESTS_STATUS" >> notification.md
          echo "" >> notification.md
          echo "### URLs:" >> notification.md
          echo "- Frontend: ${{ vars.FRONTEND_URL || 'https://aidevelo.ai' }}" >> notification.md
          echo "- Backend: ${{ vars.API_URL || 'https://real-aidevelo-ai.onrender.com' }}" >> notification.md
          echo "" >> notification.md
          echo "### Next Steps:" >> notification.md
          echo "1. Verify critical user flows manually" >> notification.md
          echo "2. Monitor error rates and logs" >> notification.md
          echo "3. Check performance metrics" >> notification.md
          echo "4. Be ready to rollback if issues arise" >> notification.md
          
          cat notification.md

      - name: Comment on release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const notification = fs.readFileSync('notification.md', 'utf8');
            
            // Find the release
            const releases = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            
            const release = releases.data.find(r => r.tag_name === '${{ github.event.inputs.version }}');
            
            if (release) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
                body: release.body + '\n\n---\n\n' + notification
              });
            }

  rollback-on-failure:
    name: Rollback Procedure
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend, post-deployment-tests]
    if: failure()
    steps:
      - name: Rollback instructions
        run: |
          echo "❌ Deployment failed - Manual rollback required"
          echo ""
          echo "To rollback:"
          echo "1. Go to Cloudflare Pages dashboard and rollback to previous deployment"
          echo "2. Go to Render dashboard and rollback to previous deployment"
          echo "3. Or revert the git tag:"
          echo "   git tag -d ${{ github.event.inputs.version }}"
          echo "   git push origin :refs/tags/${{ github.event.inputs.version }}"
          echo ""
          echo "Check the logs above for specific failure reasons."
